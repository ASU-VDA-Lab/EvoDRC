# EvoDRC in-container run configuration.
# Read by agent/src/iter/conf.py. ENVIRONMENT VARIABLES OVERRIDE EVERY KEY HERE.
# Syntax: KEY=VALUE ; '#' starts a comment ; blank lines ignored ; NO ${VAR} expansion.
#
# WHY A FILE: evaluate_claude.sh's `docker exec` forwards ONLY CLAUDE_EFFORT,
# CLAUDE_CODE_MAX_OUTPUT_TOKENS, PYTHONDONTWRITEBYTECODE and RECORD_TOKENS, so
# ABLATION cannot reach the container through the environment. Edit this file.

# '' = production | 1 = cold-start seed | 2 = frozen knowledge | 3 = whole-design
ABLATION=
# empty => derived from ABLATION (3 for '', '1', '2'; 5 for '3')
MAX_ITERS=
LEAF_CONCURRENCY=5
# exp3 (default) | legacy.  legacy + ABLATION=3 is REFUSED (would inline the whole block).
EVODRC_PROMPT_MODE=exp3
KNOW_CONCURRENCY=2
KNOW_ATTEMPTS=2

# --- THE global LLM call throttle ------------------------------------------
# ONE gate (agent/src/iter/throttle.py) covers EVERY claude call the agent
# makes: leaf/unit repair AND all three knowledge calls (markov, stateless,
# judge). It binds regardless of LEAF_CONCURRENCY / KNOW_CONCURRENCY, which
# remain per-phase sub-caps -- e.g. MAX_CONCURRENT_CALLS=3 with
# LEAF_CONCURRENCY=10 still never exceeds 3 calls in flight.
# Maximum calls IN FLIGHT at the same time, process-wide. 0 = unlimited.
# 5 matches harness/config.env CAP=5, the published experiments' value.
# A negative value is invalid and falls back to this default; only an
# explicit 0 means unlimited.
MAX_CONCURRENT_CALLS=5
# Seconds a freed slot stays closed AFTER a call completes, before the next
# queued call may start on it. 0 = no cooldown. Fractional values allowed.
# A negative value is invalid and falls back to this default; only an
# explicit 0 means no cooldown.
CALL_COOLDOWN_SECONDS=2

# --- contested-unit / shared-via arbitration -------------------------------
# Accepted spellings for the three booleans below: 1/0, true/false, yes/no,
# on/off (case-insensitive). An unrecognised value keeps the default.

# Contested-unit DRC tournament. When several repair units propose ops on the
# same shared target, cu_drc measures each candidate with a real crop DRC and
# keeps one winner; it writes iter<N>/cu_verdicts.json. 0 disables it and the
# loop falls back to legacy first-wins assembly.
CU_DRC=1
# 1 loosens the tournament acceptance threshold from delta_total < 0 (strict
# improvement only) to delta_total <= 0, so a NEUTRAL candidate also qualifies.
# The connectivity-preserved requirement is UNCHANGED by this knob.
CU_DELTA_LE0=1
# N-way isolated-cell DRC competition for a via cell claimed by >1 unit.
# 0 disables it; assembly then falls open to the lexicographic winner.
VIA_COMPETITION=1
