#################################################################################
# EvoDRC run configuration, read inside the container by
# agent/src/iter/conf.py.
#
# Syntax: KEY=VALUE, one per line. '#' starts a comment, blank lines are
# ignored, and ${VAR} is left as written. An environment variable of the same
# name takes precedence over the value set here.
#
# These settings live in a file because the benchmark's `docker exec` forwards
# only CLAUDE_EFFORT, CLAUDE_CODE_MAX_OUTPUT_TOKENS, PYTHONDONTWRITEBYTECODE
# and RECORD_TOKENS into the container, so ABLATION has to travel with the
# agent folder itself.

# ABLATION -- which experiment to run.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   ''    | Production. Starts with prior experience and keeps learning.
#   1     | Cold start. Starts with the rules only, no prior experience.
#   2     | Frozen. Starts with experience and never updates it.
#   3     | Whole design. Repairs the block as one unit instead of splitting.
#   other | Stops the run with an error.
#
ABLATION=

# MAX_ITERS -- most rounds to run. A run also stops early once the design is
# clean or nothing is left that can be repaired.
#
#   Value  | Meaning
#   -------+-----------------------------------------------------------------
#   (empty)| 5, the value the published experiments used.
#   N >= 1 | At most N rounds.
#   < 1    | Stops the run with an error.
#
MAX_ITERS=

# LEAF_CONCURRENCY -- pieces repaired in parallel. This is a sub-cap under
# MAX_CONCURRENT_CALLS, which still bounds the total.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   5     | Default.
#   N > 0 | At most N pieces at a time.
#   0     | Every piece at once, bounded only by the global throttle.
#   < 0   | Treated as a typo; falls back to the default.
#
LEAF_CONCURRENCY=5

# EVODRC_PROMPT_MODE -- the request format.
#
#   Value  | Meaning
#   -------+-----------------------------------------------------------------
#   exp3   | Default. The format every published experiment used.
#   legacy | Older format. Refused with ABLATION=3, which it would answer by
#          | inlining the whole block into a single request.
#   other  | Stops the run with an error.
#
EVODRC_PROMPT_MODE=exp3

# KNOW_CONCURRENCY -- layers whose notes are updated in parallel. Also a
# sub-cap under MAX_CONCURRENT_CALLS.
#
#   Value  | Meaning
#   -------+-----------------------------------------------------------------
#   2      | Default.
#   N >= 1 | At most N layers at a time.
#   0      | Treated as 1.
#   < 0    | Treated as a typo; falls back to the default.
#
KNOW_CONCURRENCY=2

# KNOW_ATTEMPTS -- tries allowed for one note rewrite and for one judging
# step. A draft that breaks the output contract is asked again with the
# offending lines quoted back.
#
#   Value  | Meaning
#   -------+-----------------------------------------------------------------
#   2      | Default: one initial call plus one retry.
#   N >= 1 | N tries in total.
#   0      | Treated as 1, so a bad draft is used as it came back.
#   < 0    | Treated as a typo; falls back to the default.
#
KNOW_ATTEMPTS=2

# --- Global model-call throttle ---------------------------------------------
# A single gate (agent/src/iter/throttle.py) covers every model call the agent
# makes: piece repair and all three knowledge calls. LEAF_CONCURRENCY and
# KNOW_CONCURRENCY are per-phase sub-caps underneath it, so
# MAX_CONCURRENT_CALLS=3 with LEAF_CONCURRENCY=10 keeps three calls in flight.

# MAX_CONCURRENT_CALLS -- model calls in flight at the same time,
# process-wide.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   5     | Default. The value the published experiments used.
#   N > 0 | At most N calls in flight.
#   0     | No limit.
#   < 0   | Treated as a typo; falls back to the default.
#
MAX_CONCURRENT_CALLS=5

# CALL_COOLDOWN_SECONDS -- how long a freed slot stays closed after a call
# completes, before the next queued call starts on it.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   2     | Default.
#   N > 0 | Wait N seconds. Fractions are accepted.
#   0     | No cooldown.
#   < 0   | Treated as a typo; falls back to the default.
#
CALL_COOLDOWN_SECONDS=2

# --- Contested-unit and shared-via arbitration ------------------------------
# The three switches below accept 1/0, true/false, yes/no and on/off in any
# case. An unrecognised value keeps the default.

# CU_DRC -- contested-unit DRC tournament. When several repair units propose
# operations on the same shared target, each candidate is measured with a real
# crop DRC and one winner is kept.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   1     | Default. Runs the tournament and writes iter<N>/cu_verdicts.json.
#   0     | Hands assembly back to first-wins ordering.
#   other | Keeps the default.
#
CU_DRC=1

# CU_DELTA_LE0 -- acceptance threshold for that tournament. Either setting
# still requires the winning candidate to preserve connectivity.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   1     | Default. Admits a candidate whose measured delta is zero as well
#         | as one that improves.
#   0     | Requires a strict improvement.
#   other | Keeps the default.
#
CU_DELTA_LE0=1

# VIA_COMPETITION -- isolated-cell DRC competition for a via cell claimed by
# more than one unit.
#
#   Value | Meaning
#   ------+------------------------------------------------------------------
#   1     | Default. Measures each claimant and keeps the best.
#   0     | Gives the cell to the lexicographic winner instead.
#   other | Keeps the default.
#
VIA_COMPETITION=1
